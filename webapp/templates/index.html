<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0a" />
<title>Мита</title>
<link rel="stylesheet" href="/static/style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo">М</span>
      <div>
        <div class="brand-name">Мита</div>
        <div class="brand-sub" id="userName">загрузка…</div>
      </div>
    </div>
    <button class="icon-btn" id="refreshBtn" aria-label="Обновить">↻</button>
  </header>

  <section class="quick">
    <input id="quickInput" type="text" placeholder="Быстрая заметка…" autocomplete="off" />
    <button id="quickAdd" class="primary-btn">Добавить</button>
  </section>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-screen="notes">Заметки</button>
    <button class="tab" data-screen="reminders">Календарь</button>
    <button class="tab" data-screen="materials">Материалы</button>
    <button class="tab" data-screen="settings">Стиль</button>
  </nav>

  <main id="screens">
    <section class="screen active" id="screen-notes">
      <div class="list" id="notesList"></div>
    </section>

    <section class="screen" id="screen-reminders">
      <div class="list" id="remindersList"></div>
    </section>

    <section class="screen" id="screen-materials">
      <div class="list" id="materialsList"></div>
    </section>

    <section class="screen" id="screen-settings">
      <h2 class="screen-title">Стиль общения</h2>
      <div class="style-grid" id="styleGrid"></div>
      <h2 class="screen-title">Профиль</h2>
      <div class="card" id="profileCard"></div>
    </section>
  </main>

  <div class="toast" id="toast"></div>
</div>
<script src="/static/app.js"></script>
</body>
</html>
